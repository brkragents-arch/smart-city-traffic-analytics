<svg viewBox="0 0 1200 730" width="1200" height="730" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="cyanBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2942" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#091929" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="amberBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2510" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1f1409" stop-opacity="0.98"/>
