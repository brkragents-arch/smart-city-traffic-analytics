    <linearGradient id="roseBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f1525" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#230b14" stop-opacity="0.98"/>
